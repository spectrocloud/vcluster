name: Workflow Linting

on:
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    # Scoped to this job rather than the whole workflow.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Get changed workflow files
        id: changed-files
        uses: tj-actions/changed-files@ed68ef82c095e0d48ec87eccea555d944a631a4c # v46.0.5
        with:
          files: .github/workflows/**/*.{yml,yaml}

      - name: Run actionlint with reviewdog
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: reviewdog/action-actionlint@d63ba7532e0942965320cd8d73cbae4c7b3c5283 # v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          filter_mode: file
          fail_on_error: true

      - name: No workflow files changed
        if: steps.changed-files.outputs.any_changed != 'true'
        run: echo "No workflow files were changed in this PR. Skipping actionlint."