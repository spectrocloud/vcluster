name: Release

on:
  release:
    types: [created]

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v') == true
    name: Publish vcluster
    runs-on: ubuntu-22.04

    outputs:
      release_version: ${{ steps.get_version.outputs.release_version }}
      previous_tag: ${{ steps.get_version.outputs.previous_tag }}

    permissions:
      id-token: write # This is the key for OIDC cosign!
      packages: write
      contents: write

    steps:
      - name: Remove default packages
        run: |
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Setup Just
        uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6 # v2
      - name: Setup Cosgin
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017 # main
        with:
          cosign-release: "v2.2.3"
      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@7b36ad622f042cab6f59a75c2ac24ccb256e9b45 # v0.20.4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: "v3.0.2"
      - id: get_version
        run: |
          RELEASE_VERSION=$(echo $GITHUB_REF | sed -nE 's!refs/tags/!!p')
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$(git describe --abbrev=0 --tags "$(git rev-list --tags --skip=1 --max-count=1)")" >> "$GITHUB_OUTPUT"
      - name: Validate semver
        id: semver
        uses: loft-sh/github-actions/.github/actions/semver-validation@6b5890feaccd82f7c0999ccf10a425cd0844dee0 # semver-validation/v1
        with:
          version: ${{ steps.get_version.outputs.release_version }}
      - name: Check if release would downgrade homebrew tap
        id: check_latest_stable
        run: |
          CURRENT_TAG="${{ steps.get_version.outputs.release_version }}"
          # Only check stable releases. Pre-releases are handled by
          # goreleaser's skip_upload: auto in .goreleaser.yaml.
          if [[ "$CURRENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Fetch the current version from the homebrew tap formula with
            # retry + exponential backoff. If we can't verify the tap version
            # we must fail — otherwise an older release could silently overwrite
            # the latest version in the tap.
            TAP_VERSION=""
            for attempt in 1 2 3; do
              TAP_VERSION=$(curl -sfL --max-time 10 \
                "https://raw.githubusercontent.com/loft-sh/homebrew-tap/main/Formula/vcluster.rb" \
                | grep -oP 'version "\K[^"]+') && break
              TAP_VERSION=""
              delay=$((1 << attempt))  # 2, 4, 8 seconds
              echo "::warning::Attempt $attempt/3 to fetch tap version failed, retrying in ${delay}s..."
              sleep "$delay"
            done

            if [ -z "$TAP_VERSION" ]; then
              echo "::error::Failed to fetch homebrew tap version after 3 attempts. Failing to prevent potential tap downgrade."
              exit 1
            fi

            CURRENT_VERSION="${CURRENT_TAG#v}"
            if [ "$(printf '%s\n' "$CURRENT_VERSION" "$TAP_VERSION" | sort -V | tail -1)" != "$CURRENT_VERSION" ]; then
              echo "skip_homebrew=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping Homebrew upload: $CURRENT_TAG would downgrade tap from v$TAP_VERSION"
            else
              echo "skip_homebrew=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "skip_homebrew=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Login to DockerHub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: "goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a" # v6
        with:
          args: release --clean --timeout 60m ${{ steps.check_latest_stable.outputs.skip_homebrew == 'true' && '--skip=homebrew' || '' }}
          version: "~> v2"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          TELEMETRY_PRIVATE_KEY: ${{ secrets.VCLUSTER_TELEMETRY_PRIVATE_KEY }}
          GORELEASER_CURRENT_TAG: ${{ steps.get_version.outputs.release_version }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.get_version.outputs.previous_tag }}
      - name: Save release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release/
      - name: Attach assets to release
        uses: FabianKramm/release-asset-action@6a964e8a644f28832c3f9a46abc69dda52fc6d17 # v1
        with:
          pattern: "release/*"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger cli-docs workflow
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        continue-on-error: true
        env:
          RELEASE_VERSION: ${{ steps.get_version.outputs.release_version }}
          GITHUB_REF_NAME_FULL: ${{ github.ref }}
        with:
          github-token: ${{ secrets.GH_ACCESS_TOKEN }}
          script: |
            const version = process.env.RELEASE_VERSION;
            const ref = process.env.GITHUB_REF_NAME_FULL;
            // Using repository_dispatch instead of workflow_dispatch
            const response = await github.rest.repos.createDispatchEvent({
              owner: 'loft-sh',
              repo: 'vcluster-docs',
              event_type: 'update-cli-docs',
              client_payload: {
                version,
                ref,
              }
            });
            console.log(response);

  publish-chart:
    if: startsWith(github.ref, 'refs/tags/v') == true
    needs: [publish]
    uses: ./.github/workflows/publish-chart.yaml
    with:
      release_version: ${{ needs.publish.outputs.release_version }}
      ref: ${{ github.ref }}
    secrets: inherit

  # The workflow will only trigger on non-draft releases
  # https://docs.github.com/en/actions/writing-workflows/choosing-when-your-workflow-runs/events-that-trigger-workflows#release
  sync_linear:
    needs:
      - publish
      - publish-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          cache: false
          go-version-file: go.mod
      - name: Update linear issues
        run: go run . -release-tag="${{ needs.publish.outputs.release_version }}"
        working-directory: hack/linear-sync
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          LINEAR_TOKEN: ${{ secrets.LINEAR_TOKEN }}
