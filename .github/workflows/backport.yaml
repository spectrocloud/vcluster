name: Automatic backport action

on:
  # zizmor: ignore[dangerous-triggers]
  # pull_request_target is required: backporting a merged PR needs a token with
  # write access, which pull_request does not get from forks. This is the safe
  # variant of the pattern - the checkout below takes the base repo at the
  # default ref and never checks out the PR head, so no untrusted code from the
  # pull request is executed in this privileged context.
  pull_request_target:
    types: ["labeled", "closed"]

jobs:
  backport:
    name: Backport PR
    if: |
      github.event.pull_request.merged == true &&
      (
        contains(
          join(github.event.pull_request.labels.*.name, ','),
          'backport-to-'
        )
      ) &&
      (github.event.action == 'closed' || startsWith(github.event.label.name, 'backport-to-'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@af38ce09b1ec248aeb08eea2b16bbecea9e059f8 # v0.2.1

      - name: Backport Action
        uses: sorenlouv/backport-github-action@ad888e978060bc1b2798690dd9d03c4036560947 # v9.5.1
        with:
          github_token: ${{ secrets.GH_ACCESS_TOKEN }}
          auto_backport_label_prefix: backport-to-

      - name: Info log
        if: ${{ success() }}
        run: cat ~/.backport/backport.info.log

      - name: Debug log
        if: ${{ failure() }}
        run: cat ~/.backport/backport.debug.log

