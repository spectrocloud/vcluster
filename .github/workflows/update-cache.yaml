name: update-cache

on:
  push:
    branches:
      - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cache:
    if: github.repository_owner == 'loft-sh' # do not run on forks
    runs-on: ubuntu-latest
    name: Build Cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - name: Set up Go
        # zizmor: ignore[cache-poisoning]
        # Populating the Go build/module cache is the entire purpose of this
        # workflow, so `cache: false` cannot apply here. It runs only on pushes
        # to main (no fork/PR input) and publishes no release artifact.
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        id: cache
        with:
          go-version-file: go.mod

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          install-only: true
          version: latest

      - name: Build and save syncer image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -x
          # Build syncer
          TELEMETRY_PRIVATE_KEY="" goreleaser build --single-target --snapshot --id vcluster --clean --output ./vcluster
          # Build cli
          TELEMETRY_PRIVATE_KEY="" goreleaser build --single-target --snapshot --id vcluster-cli --clean --output ./vcluster
          # Build tests for cache
          go test -mod=mod -test.v -c ./test/e2e
